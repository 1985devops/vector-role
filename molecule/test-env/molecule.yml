---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: oraclelinux8
    image: geerlingguy/docker-oraclelinux8-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
  - name: ubuntulatest
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
    privileged: true
    pre_build_image: true
provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
  env:
    ANSIBLE_ROLES_PATH: /home/alex/netology-ansible-roles
verifier:
  name: ansible
