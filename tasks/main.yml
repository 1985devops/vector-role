---
- name: Install wget or curl inside container if missing
  ansible.builtin.raw: |
    if command -v apt-get >/dev/null; then
      apt-get update && apt-get install -y wget;
    elif command -v dnf >/dev/null; then
      dnf install -y wget;
    fi
  changed_when: false

- name: Create Vector directories using raw bash
  ansible.builtin.raw: mkdir -p /etc/vector /var/lib/vector /usr/bin
  changed_when: false

- name: Download and install Vector using raw bash
  ansible.builtin.raw: |
    if [ ! -f /usr/bin/vector ]; then
      wget -q https://github.com{{ vector_version }}/vector-{{ vector_version }}-x86_64-unknown-linux-musl.tar.gz -O /tmp/vector.tar.gz
      tar -xzf /tmp/vector.tar.gz -C /tmp
      mv /tmp/vector-x86_64-unknown-linux-musl/bin/vector /usr/bin/vector
      rm -rf /tmp/vector*
    fi
  changed_when: true

- name: Create minimalist dummy config for Vector to pass validation
  ansible.builtin.raw: |
    echo -e "data_dir: \"/var/lib/vector\"\nsources:\n  in:\n    type: \"stdin\"\nsinks:\n  out:\n    type: \"console\"\n    inputs: [\"in\"]\n    encoding:\n      codec: \"json\"" > /etc/vector/vector.yaml
  changed_when: true
